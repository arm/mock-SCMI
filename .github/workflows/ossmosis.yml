name: IP Scan

permissions:
  contents: read

# Run this workflow serially for each PR. Cancel stale runs and fall back to
# github.ref for manual runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:

jobs:
  ossmosis-ip-scan:
    if: github.repository == 'Arm-Debug/mock-SCMI'
    runs-on: ubuntu-latest

    steps:
      - name: Check out target repository
        uses: actions/checkout@v7
        with:
          path: target
          fetch-depth: 0

      - name: Create ossmosis checkout token
        id: ossmosis-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APAP_APP_APP_ID }}
          private-key: ${{ secrets.APAP_APP_PRIVATE_KEY }}
          owner: Arm-Debug
          repositories: ossmosis
          permission-contents: read

      - name: Check out ossmosis
        uses: actions/checkout@v7
        with:
          repository: Arm-Debug/ossmosis
          path: ossmosis
          token: ${{ steps.ossmosis-token.outputs.token }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install ossmosis
        run: python -m pip install ./ossmosis

      - name: Scan history
        working-directory: target
        run: >-
          ossmosis scan-history
          --repo .
          --max-class public
          --source-ref HEAD
